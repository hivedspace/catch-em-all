[project]
name = "hived_data_eng"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.3",
    "dagster-dlt>=0.29.3",
    "dagster-duckdb>=0.29.3",
    "dagster-duckdb-pandas>=0.29.3",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "hived_data_eng"
registry_modules = [
    "hived_data_eng.components.*",
]


